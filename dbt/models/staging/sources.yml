version: 2

sources:
  - name: bronze
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: bronze
    description: Append only landing zone. Never modified after insert.
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: raw_load
        config:
          freshness:
            filter: ts_utc >= timestamp_sub(current_timestamp(), interval 30 day)
      - name: raw_generation
        config:
          freshness:
            filter: ts_utc >= timestamp_sub(current_timestamp(), interval 30 day)
      - name: raw_day_ahead_price
        config:
          freshness:
            filter: ts_utc >= timestamp_sub(current_timestamp(), interval 30 day)