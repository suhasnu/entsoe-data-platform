version: 2

models:
  - name: fct_grid_hourly
    description: >
      Hourly grid facts by bidding zone. Grain: one row per zone per hour.
      Load drives the grain; generation and price join left, so a missing
      source leaves nulls rather than dropping the hour.
    columns:
      - name: zone_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_code
      - name: ts_hour_utc
        tests:
          - not_null
      - name: load_mw
        tests:
          - not_null
      - name: renewable_pct
        description: Share of generation from renewable sources. Null when nothing generated.
      - name: carbon_intensity_g_kwh
        description: Lifecycle emissions per kWh generated, weighted by production mix.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [zone_code, ts_hour_utc]

  - name: dim_zone
    columns:
      - name: zone_code
        tests:
          - unique
          - not_null
      - name: timezone
        tests:
          - not_null

seeds:
  - name: dim_production_type
    columns:
      - name: production_type
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: [renewable, fossil, nuclear, storage, other]
      - name: flow_direction
        tests:
          - accepted_values:
              arguments:
                values: [generation, consumption]